dependencies:
  espressif/mdns: "^1.8.0"
  # Wi-Fi backend for the ESP32-P4, whose radio lives in the on-board ESP32-C6.
  # esp_wifi_remote itself ships inside esp_wifi on this target; ESP-Hosted is
  # only the RPC/SDIO implementation behind it.
  espressif/esp_hosted:
    version: ">=2.0.0"
    rules:
      - if: target in [esp32p4]
